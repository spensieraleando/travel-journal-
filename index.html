<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =========================
   MAIN PAGE
========================= */

.page {
    min-height: 100vh;
    background: #000;
    padding-top: 80px;
}


/* =========================
   TITLE
========================= */

.logo {
    text-align: center;

    font-family: Arial, Helvetica, sans-serif;

    font-size: clamp(48px, 7vw, 90px);

    font-weight: 400;

    letter-spacing: -4px;

    color: white;

    margin-bottom: 120px;
}


/* ALE */

.logo .ale {

    font-weight: 900;

    text-decoration-line: underline;

    text-decoration-color: #d62828;

    text-decoration-thickness: 5px;

    text-underline-offset: 7px;
}


/* =========================
   FILM CONTAINER
========================= */

.film-section {

    width: 100%;

    margin-bottom: 100px;
}


/* =========================
   FILM
========================= */

.film {

    position: relative;

    width: 96%;

    margin-left: 2%;

    height: 205px;

    overflow: hidden;

    cursor: pointer;

    background:

        linear-gradient(
            180deg,
            #603418 0%,
            #92542b 10%,
            #78421f 50%,
            #98592e 90%,
            #5d3219 100%
        );

    border-top:
        2px solid rgba(220,160,90,0.45);

    border-bottom:
        2px solid rgba(30,15,6,0.9);

    box-shadow:

        0 20px 35px rgba(0,0,0,0.8),

        inset 0 8px 12px rgba(255,180,100,0.07),

        inset 0 -8px 12px rgba(0,0,0,0.4);

    transform: rotate(-1.5deg);

    transition:
        transform 0.4s ease;
}


/* alternate direction */

.film-section:nth-of-type(3) .film {

    transform: rotate(1.5deg);
}


.film:hover {

    transform:
        rotate(0deg)
        scale(1.01);
}


/* =========================
   FILM PERFORATIONS
========================= */

.perforations {

    position: absolute;

    left: 0;

    right: 0;

    height: 17px;

    display: flex;

    justify-content: space-around;

    z-index: 5;
}


.perforations.top {
    top: 7px;
}


.perforations.bottom {
    bottom: 7px;
}


.hole {

    width: 25px;

    height: 13px;

    background: #000;

    border-radius: 2px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.04);
}


/* =========================
   FILM FRAMES
========================= */

.frames {

    position: absolute;

    left: 45px;

    right: 45px;

    top: 30px;

    bottom: 30px;

    display: flex;

    gap: 8px;
}


.frame {

    flex: 1;

    height: 100%;

    overflow: hidden;

    border-left:
        2px solid rgba(230,175,105,0.4);

    border-right:
        2px solid rgba(230,175,105,0.4);

    background: #321b0d;
}


.frame img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    filter:

        invert(1)

        sepia(0.7)

        saturate(1.25)

        contrast(1.3)

        brightness(0.85);

    opacity: 0.9;

    transition:
        transform 0.5s ease;
}


.film:hover .frame img {

    transform: scale(1.05);
}


/* =========================
   KODAK TEXT
========================= */

.kodak {

    position: absolute;

    right: 20px;

    top: 50%;

    transform:
        translateY(-50%)
        rotate(90deg);

    color: rgba(255,205,150,0.35);

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 3px;

    white-space: nowrap;
}


/* =========================
   COUNTRY NAME
========================= */

.country {

    margin-top: 30px;

    margin-left: 7%;

    color: white;

    font-family:
        "Courier New",
        monospace;

    font-size: 24px;

    letter-spacing: 2px;

    text-transform: uppercase;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        padding-top: 55px;
    }

    .logo {

        font-size: 48px;

        letter-spacing: -3px;

        margin-bottom: 80px;
    }

    .film {

        width: 98%;

        margin-left: 1%;

        height: 165px;
    }

    .frames {

        left: 25px;

        right: 25px;

        top: 25px;

        bottom: 25px;

        gap: 5px;
    }

    .hole {

        width: 16px;

        height: 10px;
    }

    .country {

        margin-left: 5%;

        font-size: 20px;
    }
}

</style>
