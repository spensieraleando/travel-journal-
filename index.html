<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>spensieraleando</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #030303;
    color: white;
    overflow-x: hidden;
}


/* =====================================================
   BLACK WALL
===================================================== */

.wall {

    position: relative;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,255,255,0.025) 0 1px,
            transparent 2px
        ),
        #030303;

    padding-bottom: 0;

    overflow: hidden;
}


/* subtle concrete texture */

.wall::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.18;

    background:

        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,0.05) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.035) 0 1px,
            transparent 2px
        );

    background-size:
        18px 20px,
        27px 25px;
}


/* =====================================================
   OVERHEAD LAMP
===================================================== */

.lamp {

    position: absolute;

    top: -30px;

    left: 50%;

    transform: translateX(-50%);

    width: 30px;

    height: 30px;

    border-radius: 50%;

    background: #e8d5a9;

    box-shadow:

        0 0 20px #e8d5a9,

        0 0 60px rgba(232,213,169,0.65),

        0 0 120px rgba(232,213,169,0.25);

    z-index: 3;
}


/* light cone */

.lamp-light {

    position: absolute;

    top: -10px;

    left: 50%;

    transform: translateX(-50%);

    width: 700px;

    height: 760px;

    pointer-events: none;

    z-index: 1;

    background:

        radial-gradient(
            ellipse at 50% 0%,
            rgba(245,224,175,0.22) 0%,
            rgba(245,224,175,0.10) 22%,
            rgba(245,224,175,0.035) 48%,
            transparent 72%
        );

    clip-path: polygon(
        45% 0,
        55% 0,
        100% 100%,
        0 100%
    );

    filter: blur(8px);
}


/* =====================================================
   TITLE AREA
===================================================== */

.header {

    position: relative;

    height: 270px;

    display: flex;

    justify-content: center;

    align-items: center;

    z-index: 5;
}


/* =====================================================
   SPRAY PAINT TITLE
===================================================== */

.logo {

    position: relative;

    font-family:
        "Arial Black",
        Impact,
        sans-serif;

    font-size:
        clamp(48px, 8vw, 105px);

    font-weight: 900;

    letter-spacing: -6px;

    color: #e5ded2;

    transform:
        rotate(-3deg)
        skewX(-8deg);

    /* rough painted look */

    text-shadow:

        1px 0 #e5ded2,
        -1px 0 #e5ded2,
        0 1px #e5ded2,
        0 -1px #e5ded2,

        4px 5px 0 rgba(0,0,0,0.6);

    filter:
        drop-shadow(0 0 3px rgba(255,255,255,0.12));
}


/* spray mist around title */

.logo::before {

    content: "";

    position: absolute;

    inset: -25px -35px;

    background:

        radial-gradient(
            circle,
            rgba(235,225,210,0.18) 0 1px,
            transparent 2px
        );

    background-size:
        9px 11px;

    opacity: 0.55;

    z-index: -1;

    transform: rotate(2deg);
}


/* =====================================================
   ALE
===================================================== */

.ale {

    color: #c63b32;

    position: relative;

    display: inline-block;

    transform:
        rotate(2deg)
        scale(1.05);

    text-shadow:

        1px 1px 0 #8c241f,

        3px 4px 0 rgba(0,0,0,0.55);
}


/* red spray underline */

.ale::after {

    content: "";

    position: absolute;

    left: -4px;

    right: -5px;

    bottom: -4px;

    height: 5px;

    background: #c63b32;

    border-radius: 70% 20% 60% 30%;

    transform:
        rotate(-3deg)
        skewX(-20deg);

    opacity: 0.9;
}


/* =====================================================
   INTRO
===================================================== */

.intro {

    position: relative;

    z-index: 5;

    text-align: center;

    margin-bottom: 65px;

    color: #777;

    font-family: Georgia, serif;

    font-size: 15px;

    font-style: italic;
}


/* =====================================================
   FILM AREA
===================================================== */

.film-container {

    position: relative;

    z-index: 5;

    width: 100%;

    margin-bottom: 90px;
}


/* =====================================================
   FILM
===================================================== */

.film {

    width: 91%;

    margin-left: 4.5%;

    height: 205px;

    position: relative;

    overflow: hidden;

    cursor: pointer;

    background:

        linear-gradient(
            180deg,
            #633518 0%,
            #8e512b 10%,
            #774020 50%,
            #96572e 90%,
            #5c3019 100%
        );

    box-shadow:

        0 18px 35px rgba(0,0,0,0.8),

        inset 0 8px 15px rgba(255,190,110,0.08),

        inset 0 -8px 15px rgba(0,0,0,0.4);

    transform: rotate(-1.2deg);

    transition:

        transform 0.5s ease,

        box-shadow 0.5s ease,

        width 0.5s ease;
}


.film-container:nth-of-type(even) .film {

    transform: rotate(1.3deg);
}


.film:hover {

    transform:
        rotate(0deg)
        scale(1.01);

    box-shadow:

        0 25px 45px rgba(0,0,0,0.9);
}


/* =====================================================
   KODAK MARKING
===================================================== */

.film-brand {

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        rotate(90deg);

    color: rgba(255,210,150,0.35);

    font-family: monospace;

    font-size: 8px;

    letter-spacing: 3px;

    white-space: nowrap;
}


/* =====================================================
   PERFORATIONS
===================================================== */

.perforations {

    position: absolute;

    left: 0;

    right: 0;

    top: 7px;

    height: 15px;

    display: flex;

    justify-content: space-around;

    z-index: 10;
}


.perforations.bottom {

    top: auto;

    bottom: 7px;
}


.hole {

    width: 23px;

    height: 12px;

    background: #030303;

    border-radius: 2px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.04);
}


/* =====================================================
   FRAMES
===================================================== */

.frames {

    height: 100%;

    width: 100%;

    padding:
        30px 48px;

    display: flex;

    align-items: center;

    gap: 8px;

    overflow: hidden;
}


.frame {

    flex: 1;

    min-width: 150px;

    height: 145px;

    position: relative;

    overflow: hidden;

    border:
        2px solid rgba(230,175,105,0.4);

    background: #3e2112;
}


/* =====================================================
   NEGATIVE PHOTOS
===================================================== */

.frame img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    filter:

        invert(1)

        sepia(0.75)

        saturate(1.3)

        contrast(1.25)

        brightness(0.9);

    opacity: 0.88;

    transition:
        transform 0.6s ease;
}


.film:hover .frame img {

    transform: scale(1.04);
}


/* frame numbers */

.frame::after {

    content: "36";

    position: absolute;

    right: 5px;

    bottom: 3px;

    color: rgba(255,210,160,0.65);

    font-family: monospace;

    font-size: 9px;
}


/* =====================================================
   CHALK COUNTRY NAME
===================================================== */

.country {

    margin-top: 20px;

    margin-left: 7%;

    color: #f0eee8;

    font-family:
        "Comic Sans MS",
        "Bradley Hand",
        "Segoe Print",
        cursive;

    font-size: 29px;

    font-weight: 400;

    letter-spacing: 2px;

    transform:
        rotate(-2deg);

    text-shadow:

        0 0 2px white,

        1px 1px 0 rgba(255,255,255,0.2);

    opacity: 0.9;
}


/* =====================================================
   ACTIVE FILM
===================================================== */

.film.active {

    position: fixed;

    z-index: 1000;

    left: 3vw;

    top: 8vh;

    margin: 0;

    width: 94vw;

    height: 84vh;

    transform: rotate(0deg);

    overflow-y: auto;
}


.film.active .frames {

    height: auto;

    flex-wrap: wrap;

    justify-content: center;

    padding: 70px 45px;
}


.film.active .frame {

    flex: none;

    width: 280px;

    height: 210px;
}


/* =====================================================
   CLOSE
===================================================== */

.close {

    display: none;

    position: absolute;

    top: 22px;

    right: 28px;

    z-index: 50;

    color: #e8c18c;

    font-family: Arial;

    font-size: 10px;

    letter-spacing: 3px;
}


.film.active .close {

    display: block;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.88);

    z-index: 900;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.4s ease;
}


.overlay.active {

    opacity: 1;

    pointer-events: auto;
}


/* =====================================================
   DOOR
===================================================== */

.door-area {

    position: relative;

    z-index: 5;

    height: 680px;

    display: flex;

    justify-content: center;

    align-items: flex-end;
}


.door-frame {

    width: 400px;

    height: 620px;

    background: #161616;

    border:
        8px solid #252525;

    box-shadow:

        0 0 0 2px #050505,

        0 30px 80px rgba(0,0,0,0.9);
}


.door {

    position: relative;

    height: 100%;

    margin: 12px;

    background:

        linear-gradient(
            90deg,
            #131313,
            #282828 50%,
            #121212
        );

    border:
        2px solid #393939;

    cursor: pointer;

    transform-origin: left center;

    transition:
        transform 1s ease;

    overflow: hidden;
}


/* door panels */

.door::before {

    content: "";

    position: absolute;

    inset: 35px;

    border:
        2px solid #3c3c3c;

    box-shadow:
        inset 0 0 0 10px #181818;
}


.door::after {

    content: "";

    position: absolute;

    left: 55px;

    right: 55px;

    top: 50%;

    height: 2px;

    background: #3c3c3c;
}


/* handle */

.handle {

    position: absolute;

    right: 35px;

    top: 50%;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: #a27b4f;

    z-index: 5;
}


/* enter */

.enter {

    position: absolute;

    bottom: 65px;

    left: 50%;

    transform: translateX(-50%);

    color: #bcb5aa;

    font-family: Arial;

    font-size: 9px;

    letter-spacing: 5px;

    z-index: 5;

/* =====================================================
   FOOTER
===================================================== */

    font-size: 8px;

    letter-spacing: 4px;

/* =====================================================

===================================================== */

    }

        font-size: 24px;
    }

    .door-frame {
        width: 300px;
        height: 520px;
    }

}

</style>

<script>

/* =====================================================
   OPEN FILM
===================================================== */

function openFilm(film) {

    event.stopPropagation();

    film.classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");
}


/* =====================================================
   CLOSE FILM
===================================================== */

function closeFilm(event) {

    event.stopPropagation();

    const film =
        event.target.closest(".film");

    film.classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");
}


/* =====================================================
   CLICK OUTSIDE
===================================================== */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function() {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                this.classList.remove(
                    "active"
                );
            }

        }
    );


/* =====================================================
   ESCAPE
===================================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                document
                    .getElementById("overlay")
                    .classList.remove(
                        "active"
                    );
            }
        }
    }
);


/* =====================================================
   DOOR
===================================================== */

function openDoor() {

    const door =
        document.getElementById("door");

    door.classList.toggle("open");

}

</script>
