<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Spensieraleando</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@400;500&family=Rock+Salt&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #202020;
      color: #f2f0e9;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      padding: 55px 65px;
      position: relative;
    }


    /* =========================================
       MAIN WORD
       ========================================= */

    .main-word {
      position: relative;
      display: inline-block;

      margin-top: 45px;
      margin-left: 35px;

      font-family: 'Archivo Narrow', sans-serif;
      font-size: clamp(70px, 11vw, 170px);
      font-weight: 500;

      letter-spacing: -5px;
      line-height: 0.9;

      white-space: nowrap;
    }


    /* =========================================
       THE EXISTING A
       ========================================= */

    .a-circle {
      position: relative;
      display: inline-block;
    }

    .a-circle::after {
      content: "";

      position: absolute;

      width: 1.05em;
      height: 0.85em;

      left: -0.08em;
      top: 0.02em;

      border: 3px solid #d62828;
      border-radius: 50%;

      transform: rotate(-8deg);
    }


    /* =========================================
       UNDERLINE THE EXISTING A + LE
       ========================================= */

    .ale {
      text-decoration: underline;
      text-decoration-color: #d62828;
      text-decoration-thickness: 5px;
      text-underline-offset: 7px;
    }


    /* =========================================
       "ME"
       ========================================= */

    .me {
      position: absolute;

      left: 50%;
      top: 245px;

      color: #d62828;

      font-family: 'Rock Salt', cursive;
      font-size: 27px;

      transform: rotate(-7deg);
    }


    /* =========================================
       HAND-DRAWN ARROW
       ========================================= */

    .arrow {
      position: absolute;

      left: 43%;
      top: 220px;

      width: 105px;
      height: 70px;

      border-top: 3px solid #d62828;
      border-radius: 50%;

      transform: rotate(8deg);
    }

    .arrow::after {
      content: "";

      position: absolute;

      right: -4px;
      top: -7px;

      width: 16px;
      height: 16px;

      border-top: 3px solid #d62828;
      border-right: 3px solid #d62828;

      transform: rotate(35deg);
    }


    /* =========================================
       TOP RIGHT ENGLISH DESCRIPTION
       ========================================= */

    .definition {
      position: absolute;

      top: 45px;
      right: 60px;

      width: 360px;

      color: #d62828;

      font-family: 'Rock Salt', cursive;

      font-size: 15px;
      line-height: 1.8;

      text-align: left;

      transform: rotate(-2deg);
    }


    /* =========================================
       SMALL HANDWRITTEN NOTE
       ========================================= */

    .note {
      position: absolute;

      left: 70px;
      top: 350px;

      color: #d62828;

      font-family: 'Rock Salt', cursive;
      font-size: 17px;

      transform: rotate(-4deg);
    }


    /* =========================================
       MOBILE
       ========================================= */

    @media (max-width: 800px) {

      .page {
        padding: 30px;
      }

      .main-word {
        margin-left: 0;
        margin-top: 25px;

        font-size: 17vw;
      }

      .definition {
        position: relative;

        top: auto;
        right: auto;

        width: 90%;

        margin-top: 60px;

        font-size: 14px;
        line-height: 1.7;
      }

      .arrow {
        display: none;
      }

      .me {
        position: relative;

        left: auto;
        top: auto;

        display: inline-block;

        margin-left: 55%;
        margin-top: 25px;
      }

      .note {
        position: relative;

        left: auto;
        top: auto;

        margin-top: 50px;
      }
    }

  </style>
</head>


<body>

  <main class="page">


    <!-- =====================================
         MAIN TITLE
         ===================================== -->

    <div class="main-word">
      SPENSI<span class="a-circle">A</span><span class="ale">LE</span>ANDO
    </div>


    <!-- =====================================
         RED "ME"
         ===================================== -->

    <div class="me">
      ME
    </div>


    <!-- =====================================
         HAND-DRAWN ARROW
         ===================================== -->

    <div class="arrow"></div>


    <!-- =====================================
         ENGLISH DESCRIPTION
         ===================================== -->

    <div class="definition">
      A LITTLE COLLECTION OF PLACES
      I'VE BEEN, MEMORIES I'VE MADE,
      AND ADVENTURES I NEVER WANT
      TO FORGET.
    </div>


    <!-- =====================================
         SMALL NOTE
         ===================================== -->

    <div class="note">
      a state of lightness
    </div>


  </main>

</body>
</html>
