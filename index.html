<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Travels</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Permanent+Marker&display=swap');

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f7f4ed;
      color: #222;
      font-family: 'Permanent Marker', cursive;
    }

    .page {
      min-height: 100vh;
      padding: 55px 65px;
      position: relative;
    }

    /* MAIN TITLE */
    .title {
      font-size: 58px;
      line-height: 1;
      display: inline-block;
      transform: rotate(-2deg);
      margin: 0;
    }

    /* LITTLE DESCRIPTION IN THE TOP RIGHT */
    .description {
      position: absolute;
      top: 58px;
      right: 65px;

      width: 310px;

      font-size: 17px;
      line-height: 1.45;
      text-align: right;

      transform: rotate(2deg);
    }

    /* SMALL HAND-DRAWN LINE UNDER THE TITLE */
    .little-line {
      width: 145px;
      height: 3px;
      background: #222;

      margin-top: 12px;

      transform: rotate(-3deg);
      border-radius: 50%;
    }

    /* SPACE WHERE THE TRAVEL CONTENT WILL GO LATER */
    .content {
      margin-top: 100px;
    }

    @media (max-width: 700px) {

      .page {
        padding: 35px 25px;
      }

      .title {
        font-size: 45px;
      }

      .description {
        position: static;
        width: 260px;
        margin-top: 35px;
        text-align: left;
        transform: rotate(1deg);
      }

      .little-line {
        margin-top: 10px;
      }

      .content {
        margin-top: 60px;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <!-- TITLE -->
    <h1 class="title">MY TRAVELS</h1>

    <div class="little-line"></div>


    <!-- ENGLISH DESCRIPTION -->
    <div class="description">
      A little collection of places I've been,
      memories I've made, and adventures
      I never want to forget.
    </div>


    <!-- THE REST OF THE PAGE WILL GO HERE LATER -->
    <div class="content">
    </div>

  </div>

</body>
</html>
