<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>spensieraleando</title>

<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #a59d91;
    color: #17130f;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   WALL
===================================================== */

.wall {

    min-height: 100vh;

    position: relative;

    padding-bottom: 150px;

    background-color: #9d968b;

    background-image:

        radial-gradient(
            circle at 20% 30%,
            rgba(255,255,255,0.12) 0px,
            transparent 3px
        ),

        radial-gradient(
            circle at 70% 80%,
            rgba(0,0,0,0.10) 0px,
            transparent 4px
        ),

        linear-gradient(
            90deg,
            rgba(0,0,0,0.06),
            transparent 20%,
            rgba(255,255,255,0.06) 50%,
            transparent 80%,
            rgba(0,0,0,0.05)
        );

    background-size:
        17px 19px,
        23px 27px,
        100% 100%;
}


/* subtle wall cracks */

.wall::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.35;

    background-image:

        linear-gradient(
            115deg,
            transparent 48%,
            rgba(50,45,40,0.15) 49%,
            transparent 50%
        ),

        linear-gradient(
            70deg,
            transparent 49%,
            rgba(255,255,255,0.08) 50%,
            transparent 51%
        );

    background-size:
        500px 700px,
        800px 600px;
}


/* =====================================================
   GRAFFITI TITLE
===================================================== */

.header {

    position: relative;

    height: 300px;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;
}


.logo {

    position: relative;

    font-family:
        Impact,
        Haettenschweiler,
        "Arial Black",
        sans-serif;

    font-size:
        clamp(65px, 12vw, 180px);

    font-weight: 900;

    color: #17130f;

    letter-spacing: -8px;

    transform: rotate(-4deg);

    text-transform: lowercase;

    text-shadow:

        3px 3px 0 rgba(0,0,0,0.12),

        -2px -2px 0 rgba(255,255,255,0.15);
}


/* graffiti underline */

.logo::after {

    content: "";

    position: absolute;

    height: 10px;

    width: 95%;

    left: 3%;

    bottom: -5px;

    background: #b52b24;

    border-radius: 50%;

    transform:
        rotate(-3deg)
        skewX(-20deg);
}


/* little graffiti mark */

.logo::before {

    content: "✦";

    position: absolute;

    font-family: Arial;

    font-size: 35px;

    right: -40px;

    top: 5px;

    color: #b52b24;

    transform: rotate(20deg);
}


/* =====================================================
   INTRO TEXT
===================================================== */

.intro {

    text-align: center;

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 18px;

    margin-bottom: 70px;

    opacity: 0.65;
}


/* =====================================================
   FILM STRIP
===================================================== */

.film {

    width: 100%;

    height: 260px;

    background:

        linear-gradient(
            180deg,
            #6e3c1f 0%,
            #9b5b2f 10%,
            #7a4325 50%,
            #9b5b2f 90%,
            #62351f 100%
        );

    position: relative;

    margin-bottom: 90px;

    cursor: pointer;

    transform: rotate(-1deg);

    box-shadow:

        0 18px 25px rgba(0,0,0,0.35),

        inset 0 0 30px rgba(0,0,0,0.25);

    transition:
        transform 0.5s ease,
        height 0.6s ease;

    overflow: hidden;
}


.film:nth-child(even) {

    transform: rotate(1deg);
}


/* =====================================================
   KODAK BRAND STRIP
===================================================== */

.film::after {

    content: "KODAK  400  •  400  •  400  •  400  •  400  •  400";

    position: absolute;

    right: 15px;

    top: 50%;

    transform:
        translateY(-50%)
        rotate(90deg);

    color: rgba(255,225,170,0.45);

    font-size: 9px;

    letter-spacing: 3px;

    white-space: nowrap;
}


/* =====================================================
   PERFORATION HOLES
===================================================== */

.perforations {

    position: absolute;

    left: 0;

    right: 0;

    top: 8px;

    display: flex;

    justify-content: space-around;

    z-index: 10;
}


.perforations.bottom {

    top: auto;

    bottom: 8px;
}


.hole {

    width: 27px;

    height: 15px;

    background: #9d968b;

    border-radius: 2px;

    box-shadow:
        inset 0 1px 2px rgba(0,0,0,0.35);
}


/* =====================================================
   FILM FRAMES
===================================================== */

.frames {

    height: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        35px 45px;

    overflow: hidden;
}


.frame {

    flex: 1;

    min-width: 180px;

    height: 185px;

    border:

        2px solid
        rgba(220,165,105,0.45);

    overflow: hidden;

    position: relative;

    background: #4c2818;
}


/* =====================================================
   NEGATIVE PHOTOS
===================================================== */

.frame img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    /*
       NEGATIVE EFFECT
    */

    filter:

        invert(1)

        sepia(0.75)

        saturate(1.3)

        contrast(1.2)

        brightness(0.9);

    opacity: 0.85;

    transition:

        filter 0.6s ease,

        transform 0.6s ease;
}


/* frame number */

.frame::after {

    content: "36";

    position: absolute;

    right: 6px;

    bottom: 4px;

    color: rgba(255,220,170,0.7);

    font-family: monospace;

    font-size: 10px;
}


/* =====================================================
   COUNTRY NAME
===================================================== */

.country {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-2deg);

    z-index: 20;

    color: #f1c58f;

    font-family:
        Impact,
        "Arial Black",
        sans-serif;

    font-size: 35px;

    letter-spacing: 6px;

    text-transform: uppercase;

    text-shadow:

        2px 2px 0 #32170b,

        0 0 15px rgba(0,0,0,0.6);

    pointer-events: none;
}


/* =====================================================
   HOVER
===================================================== */

.film:hover {

    transform:
        rotate(0deg)
        scale(1.015);

    box-shadow:

        0 25px 40px rgba(0,0,0,0.45);
}


.film:hover img {

    filter:

        invert(1)

        sepia(0.4)

        saturate(1.1)

        contrast(1.35);

    transform: scale(1.04);
}


/* =====================================================
   CLICKED FILM
===================================================== */

.film.active {

    position: fixed;

    z-index: 1000;

    left: 3vw;

    top: 8vh;

    width: 94vw;

    height: 84vh;

    margin: 0;

    transform: rotate(0deg);

    overflow-y: auto;

    box-shadow:

        0 30px 100px rgba(0,0,0,0.7);
}


.film.active .frames {

    flex-wrap: wrap;

    height: auto;

    padding: 80px 50px;

    justify-content: center;
}


.film.active .frame {

    flex: none;

    width: 300px;

    height: 220px;
}


/* =====================================================
   CLOSE BUTTON
===================================================== */

.close {

    position: absolute;

    top: 25px;

    right: 35px;

    z-index: 50;

    color: #f1c58f;

    font-size: 12px;

    letter-spacing: 3px;

    cursor: pointer;
}


/* =====================================================
   OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.72);

    z-index: 900;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.4s ease;
}


.overlay.active {

    opacity: 1;

    pointer-events: auto;
}


/* =====================================================
   BOTTOM TEXT
===================================================== */

.bottom {

    text-align: center;

    padding: 100px 20px 50px;

    font-family: Arial;

    font-size: 10px;

    letter-spacing: 4px;

    opacity: 0.5;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

    .header {

        height: 220px;
    }

    .logo {

        font-size: 60px;

        letter-spacing: -4px;
    }

    .film {

        height: 190px;
    }

    .frames {

        padding: 30px;

        gap: 5px;
    }

    .frame {

        min-width: 110px;

        height: 130px;
    }

    .country {

        font-size: 23px;

        letter-spacing: 3px;
    }

    .film.active {

        left: 2vw;

        top: 5vh;

        width: 96vw;

        height: 90vh;
    }

    .film.active .frame {

        width: 100%;

        height: 210px;
    }
}

</style>

<script>

function openFilm(film) {

    event.stopPropagation();

    film.classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");

}


function closeFilm(event) {

    event.stopPropagation();

    const film =
        event.target.closest(".film");

    film.classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");

}


document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function() {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                this.classList.remove(
                    "active"
                );

            }

        }
    );


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                document
                    .getElementById("overlay")
                    .classList.remove(
                        "active"
                    );

            }

        }

    }
);

</script>
