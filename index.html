<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>spensieraleando</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #000;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
}


/* =========================
   PAGE
========================= */

.page {
    min-height: 100vh;
    padding: 75px 7% 100px;
    background: #000;
}


/* =========================
   TITLE
========================= */

.logo {
    text-align: center;

    font-size: clamp(48px, 7vw, 82px);

    font-weight: 400;

    letter-spacing: -4px;

    margin-bottom: 120px;
}

.logo .ale {
    font-weight: 900;

    text-decoration: underline;

    text-decoration-color: #d62828;

    text-decoration-thickness: 5px;

    text-underline-offset: 7px;
}


/* =========================
   GALLERY
========================= */

.gallery {

    max-width: 1100px;

    margin: 0 auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    column-gap: 110px;

    row-gap: 130px;
}


/* =========================
   COUNTRY CARD
========================= */

.country-card {

    position: relative;

    cursor: pointer;

    width: 100%;

    transition:
        transform 0.4s ease;
}


/* slight different positioning */

.country-card:nth-child(1) {
    transform: rotate(-2deg);
}

.country-card:nth-child(2) {
    transform: rotate(2deg);
}

.country-card:nth-child(3) {
    transform: rotate(1.5deg);
}

.country-card:nth-child(4) {
    transform: rotate(-2.5deg);
}


.country-card:hover {
    transform:
        rotate(0deg)
        translateY(-10px);
}


/* =========================
   PHOTO STACK
========================= */

.photo-stack {

    position: relative;

    width: 100%;

    aspect-ratio: 4 / 3;

}


/* the layers behind the main photo */

.photo-stack::before,
.photo-stack::after {

    content: "";

    position: absolute;

    inset: 0;

    background: #e8e2d8;

    z-index: 0;

}


/* first paper/photo */

.photo-stack::before {

    transform:
        translate(13px, 13px)
        rotate(3deg);

    box-shadow:
        0 12px 25px rgba(0,0,0,0.7);
}


/* second paper/photo */

.photo-stack::after {

    transform:
        translate(-12px, 8px)
        rotate(-4deg);

    box-shadow:
        0 12px 25px rgba(0,0,0,0.6);

    z-index: 1;
}


/* =========================
   EXTRA LAYER
========================= */

.stack-layer {

    position: absolute;

    inset: 0;

    background: #cfc8bb;

    z-index: 0;

    transform:
        translate(6px, 20px)
        rotate(5deg);

    box-shadow:
        0 15px 30px rgba(0,0,0,0.7);
}


/* =========================
   MAIN PHOTO
========================= */

.main-photo {

    position: absolute;

    inset: 0;

    z-index: 3;

    background: #222;

    padding: 7px;

    box-shadow:

        0 20px 40px rgba(0,0,0,0.8),

        0 3px 8px rgba(0,0,0,0.6);
}


.main-photo img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    display: block;

    filter:
        saturate(0.8)
        contrast(1.05);

    transition:
        transform 0.5s ease,
        filter 0.5s ease;
}


.country-card:hover .main-photo img {

    transform: scale(1.025);

    filter:
        saturate(1)
        contrast(1.08);
}


/* =========================
   COUNTRY NAME
========================= */

.country-name {

    position: relative;

    z-index: 5;

    margin-top: 38px;

    text-align: center;

    font-family:
        "Courier New",
        monospace;

    font-size: 22px;

    letter-spacing: 4px;

    color: white;

    text-transform: uppercase;
}


/* little handwritten feeling */

.country-name::before {

    content: "—";

    margin-right: 10px;

    color: #777;
}

.country-name::after {

    content: "—";

    margin-left: 10px;

    color: #777;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .page {
        padding: 50px 7% 80px;
    }

    .logo {

        font-size: 48px;

        margin-bottom: 90px;
    }

    .gallery {

        grid-template-columns: 1fr;

        gap: 100px;

        max-width: 500px;
    }

    .country-card:nth-child(1),
    .country-card:nth-child(2),
    .country-card:nth-child(3),
    .country-card:nth-child(4) {

        transform: rotate(0deg);
    }

    .country-name {

        font-size: 19px;
    }
}

</style>
</head>


<body>


<div class="page">


    <!-- =========================
         TITLE
    ========================== -->

    <h1 class="logo">

        spensier<span class="ale">ale</span>ando

    </h1>



    <!-- =========================
         COUNTRIES
    ========================== -->

    <div class="gallery">


        <!-- ITALIA -->

        <div class="country-card">

            <div class="photo-stack">

                <div class="stack-layer"></div>

                <div class="main-photo">

                    <img
                        src="https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=1200&q=90"
                        alt="Italy"
                    >

                </div>

            </div>

            <div class="country-name">
                Italia
            </div>

        </div>



        <!-- GREECE -->

        <div class="country-card">

            <div class="photo-stack">

                <div class="stack-layer"></div>

                <div class="main-photo">

                    <img
                        src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=1200&q=90"
                        alt="Greece"
                    >

                </div>

            </div>

            <div class="country-name">
                Greece
            </div>

        </div>



        <!-- ENGLAND -->

        <div class="country-card">

            <div class="photo-stack">

                <div class="stack-layer"></div>

                <div class="main-photo">

                    <img
                        src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1200&q=90"
                        alt="England"
                    >

                </div>

            </div>

            <div class="country-name">
                England
            </div>

        </div>



        <!-- JAPAN -->

        <div class="country-card">

            <div class="photo-stack">

                <div class="stack-layer"></div>

                <div class="main-photo">

                    <img
                        src="https://images.unsplash.com/photo-1493976040374-85c8e12f0c0e?auto=format&fit=crop&w=1200&q=90"
                        alt="Japan"
                    >

                </div>

            </div>

            <div class="country-name">
                Japan
            </div>

        </div>


    </div>

</div>


</body>
</html>
