<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>spensieraleando — travel archive</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    background: #dedbd2;
    color: #111;
    font-family: Georgia, "Times New Roman", serif;
    overflow-x: hidden;
}


/* =================================
   PAPER
================================= */

.paper {
    min-height: 100vh;
    padding: 50px 7%;
    position: relative;

    background:
        radial-gradient(
            rgba(0,0,0,0.04) 1px,
            transparent 1px
        );

    background-size: 5px 5px;
}


/* =================================
   HEADER
================================= */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 100px;

    border-bottom: 1px solid #999;
    padding-bottom: 18px;
}

.logo {
    font-size: 25px;
    font-style: italic;
}

.logo span {
    text-decoration: underline;
    text-decoration-color: #b32626;
    text-decoration-thickness: 2px;
}

.archive {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
}


/* =================================
   INTRO
================================= */

.intro {
    max-width: 650px;
    margin-bottom: 100px;
}

.intro h1 {
    font-size: clamp(55px, 9vw, 120px);
    font-weight: normal;
    line-height: 0.85;
    letter-spacing: -7px;
}

.intro p {
    margin-top: 30px;
    font-family: Arial, sans-serif;
    font-size: 12px;
    line-height: 1.7;
    max-width: 350px;
}


/* =================================
   FILM ARCHIVE
================================= */

.film-archive {
    position: relative;

    display: flex;
    flex-direction: column;

    gap: 90px;

    padding: 50px 0 150px;
}


/* =================================
   FILM STRIP
================================= */

.film {
    width: 90%;
    height: 190px;

    background: #090909;

    position: relative;

    display: flex;
    align-items: center;

    cursor: pointer;

    transform: rotate(-2deg);

    transition:
        transform 0.5s ease,
        width 0.6s ease,
        height 0.6s ease;

    overflow: hidden;

    box-shadow:
        0 15px 25px rgba(0,0,0,0.25);
}


/* Alternating angles */

.film:nth-child(2) {
    align-self: flex-end;
    transform: rotate(2deg);
}

.film:nth-child(3) {
    transform: rotate(-1deg);
}

.film:nth-child(4) {
    align-self: flex-end;
    transform: rotate(3deg);
}


/* =================================
   FILM HOLES
================================= */

.holes {
    position: absolute;

    top: 5px;
    bottom: 5px;

    left: 0;
    right: 0;

    display: flex;

    justify-content: space-around;

    pointer-events: none;
}

.hole {
    width: 20px;
    height: 12px;

    background: #dedbd2;

    margin-top: 0;

    box-shadow:
        0 160px #dedbd2;
}


/* =================================
   PHOTOS INSIDE FILM
================================= */

.frames {
    display: flex;

    gap: 12px;

    padding: 25px 45px;

    width: 100%;

    justify-content: center;
}

.frame {

    width: 180px;
    height: 130px;

    flex-shrink: 0;

    overflow: hidden;

    border-left: 2px solid #222;
    border-right: 2px solid #222;
}

.frame img {

    width: 100%;
    height: 100%;

    object-fit: cover;

    filter:
        grayscale(1)
        contrast(1.2)
        brightness(0.8);

    transition: 0.5s ease;
}


/* =================================
   COUNTRY LABEL
================================= */

.country {

    position: absolute;

    z-index: 5;

    left: 50%;
    top: 50%;

    transform: translate(-50%, -50%);

    color: white;

    font-family: Arial, sans-serif;

    font-size: 13px;

    letter-spacing: 5px;

    text-transform: uppercase;

    pointer-events: none;

    background: rgba(0,0,0,0.7);

    padding: 10px 18px;
}


/* =================================
   HOVER
================================= */

.film:hover {

    width: 96%;

    transform:
        rotate(0deg)
        scale(1.02);

    box-shadow:
        0 25px 50px rgba(0,0,0,0.35);
}

.film:hover img {

    filter:
        grayscale(0)
        contrast(1)
        brightness(1);
}


/* =================================
   ACTIVE / CLICKED FILM
================================= */

.film.active {

    position: fixed;

    z-index: 1000;

    width: 90vw;

    height: 80vh;

    left: 5vw;

    top: 10vh;

    transform: rotate(0deg);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.6);

    cursor: default;

    overflow-y: auto;
}


/* Make the photographs bigger */

.film.active .frames {

    flex-wrap: wrap;

    padding: 80px 50px;

    gap: 25px;
}

.film.active .frame {

    width: 250px;

    height: 180px;
}

.film.active .frame img {

    filter:
        grayscale(0)
        contrast(1)
        brightness(1);
}


/* =================================
   CLOSE BUTTON
================================= */

.close {

    position: absolute;

    right: 25px;
    top: 20px;

    z-index: 20;

    color: white;

    font-family: Arial, sans-serif;

    font-size: 12px;

    letter-spacing: 2px;

    cursor: pointer;

    display: none;
}

.film.active .close {
    display: block;
}


/* =================================
   DARK OVERLAY
================================= */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.75);

    z-index: 900;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.4s ease;
}

.overlay.active {

    opacity: 1;

    pointer-events: auto;
}


/* =================================
   FOOTER
================================= */

footer {

    border-top: 1px solid #999;

    padding: 30px 0;

    display: flex;

    justify-content: space-between;

    font-family: Arial, sans-serif;

    font-size: 9px;

    letter-spacing: 2px;

    text-transform: uppercase;

    color: #555;
}


/* =================================
   MOBILE
================================= */

@media(max-width: 700px) {

    .paper {
        padding: 30px 5%;
    }

    header {
        margin-bottom: 70px;
    }

    .intro {
        margin-bottom: 70px;
    }

    .film {
        width: 100%;
        height: 150px;
    }

    .frame {
        width: 130px;
        height: 95px;
    }

    .frames {
        padding: 25px;
        gap: 7px;
    }

    .film.active {
        width: 94vw;
        left: 3vw;
        height: 85vh;
        top: 7vh;
    }

    .film.active .frame {
        width: 100%;
        height: 200px;
    }

    .film.active .frames {
        padding: 60px 20px;
    }

}


/* =================================
   CAMERA FLASH EFFECT
================================= */

.flash {

    position: fixed;

    inset: 0;

    background: white;

    z-index: 2000;

    opacity: 0;

    pointer-events: none;
}

.flash.active {

    animation: cameraFlash 0.5s ease;
}

@keyframes cameraFlash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: 0.9;
    }

    100% {
        opacity: 0;
    }
}

</style>
</head>


<body>


<div class="paper">


    <!-- HEADER -->

    <header>

        <div class="logo">
            spensier<span>ale</span>ando
        </div>

        <div class="archive">
            personal travel archive · 2026
        </div>

    </header>



    <!-- INTRO -->

    <section class="intro">

        <h1>
            Places<br>
            I've Been.
        </h1>

        <p>
            A collection of photographs, places,
            memories and moments collected
            along the way.
        </p>

    </section>



    <!-- FILMS -->

    <section class="film-archive">


        <!-- ITALY -->

        <div class="film" onclick="openFilm(this)">

            <div class="close" onclick="closeFilm(event)">
                CLOSE ×
            </div>

            <div class="country">
                Italia
            </div>

            <div class="frames">

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1529260830199-42c24126f198?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1516483638261-f4dbaf036963?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1533105079780-92b9be482077?auto=format&fit=crop&w=1000&q=80">
                </div>

            </div>

        </div>



        <!-- GREECE -->

        <div class="film" onclick="openFilm(this)">

            <div class="close" onclick="closeFilm(event)">
                CLOSE ×
            </div>

            <div class="country">
                Greece
            </div>

            <div class="frames">

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1601581875309-fafbf2d3ed3a?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1570077188670-e3a8d69ac5ff?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1603565816030-6b389eeb23cb?auto=format&fit=crop&w=1000&q=80">
                </div>

            </div>

        </div>



        <!-- UK -->

        <div class="film" onclick="openFilm(this)">

            <div class="close" onclick="closeFilm(event)">
                CLOSE ×
            </div>

            <div class="country">
                United Kingdom
            </div>

            <div class="frames">

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1513635269975-59663e0ac1ad?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1529655683826-aba9b3e77383?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1533929736458-ca588d08c8be?auto=format&fit=crop&w=1000&q=80">
                </div>

            </div>

        </div>



        <!-- FRANCE -->

        <div class="film" onclick="openFilm(this)">

            <div class="close" onclick="closeFilm(event)">
                CLOSE ×
            </div>

            <div class="country">
                France
            </div>

            <div class="frames">

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1502602898657-3e91760cbb34?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1499856871958-5b9627545d1a?auto=format&fit=crop&w=1000&q=80">
                </div>

                <div class="frame">
                    <img src="https://images.unsplash.com/photo-1508057198894-247b23fe5ade?auto=format&fit=crop&w=1000&q=80">
                </div>

            </div>

        </div>


    </section>



    <!-- FOOTER -->

    <footer>

        <span>
            SPENSIERALEANDO
        </span>

        <span>
            FILM / 01 — 04
        </span>

        <span>
            KEEP TRAVELLING
        </span>

    </footer>


</div>


<!-- DARK BACKGROUND -->

<div class="overlay" id="overlay"></div>

<!-- CAMERA FLASH -->

<div class="flash" id="flash"></div>


<script>

function openFilm(film) {

    event.stopPropagation();

    film.classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");

    document
        .getElementById("flash")
        .classList.add("active");

    setTimeout(() => {

        document
            .getElementById("flash")
            .classList.remove("active");

    }, 500);

}


function closeFilm(event) {

    event.stopPropagation();

    const film =
        event.target.closest(".film");

    film.classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");
}


document
    .getElementById("overlay")
    .addEventListener("click", function() {

        const activeFilm =
            document.querySelector(".film.active");

        if (activeFilm) {

            activeFilm.classList.remove("active");

            this.classList.remove("active");

        }

    });


document.addEventListener("keydown", function(event) {

    if (event.key === "Escape") {

        const activeFilm =
            document.querySelector(".film.active");

        if (activeFilm) {

            activeFilm.classList.remove("active");

            document
                .getElementById("overlay")
                .classList.remove("active");

        }

    }

});

</script>


</body>
</html>
