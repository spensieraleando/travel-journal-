<style>

/* =========================================================
   RESET
========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050403;
    color: white;
    overflow-x: hidden;
}


/* =========================================================
   WALL
========================================================= */

.wall {

    position: relative;

    min-height: 100vh;

    overflow: hidden;

    background:

        radial-gradient(
            ellipse at 50% 20%,
            rgba(112, 78, 38, 0.25),
            transparent 35%
        ),

        radial-gradient(
            ellipse at 50% 60%,
            rgba(60, 45, 30, 0.16),
            transparent 55%
        ),

        linear-gradient(
            90deg,
            #050504 0%,
            #11100d 50%,
            #050504 100%
        );
}


/* rough wall texture */

.wall::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.6;

    background-image:

        radial-gradient(
            circle at 10% 20%,
            rgba(255,255,255,0.05) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 70% 40%,
            rgba(255,255,255,0.035) 0 1px,
            transparent 2px
        ),

        radial-gradient(
            circle at 30% 80%,
            rgba(0,0,0,0.8) 0 2px,
            transparent 5px
        );

    background-size:
        17px 19px,
        23px 27px,
        31px 33px;

    mix-blend-mode: overlay;

    z-index: 1;
}


/* darker edges */

.wall::after {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at center,
            transparent 35%,
            rgba(0,0,0,0.65) 100%
        );

    z-index: 2;
}


/* =========================================================
   LAMP
========================================================= */

.lamp {

    position: absolute;

    top: 30px;

    left: 50%;

    transform: translateX(-50%);

    width: 100px;

    height: 105px;

    z-index: 10;
}


/* wire */

.lamp-wire {

    position: absolute;

    top: -60px;

    left: 50%;

    width: 5px;

    height: 100px;

    transform: translateX(-50%);

    background: #191713;

    border-radius: 5px;
}


/* lamp body */

.lamp-shade {

    position: absolute;

    top: 30px;

    left: 50%;

    transform: translateX(-50%);

    width: 75px;

    height: 55px;

    background:

        linear-gradient(
            90deg,
            #171614,
            #39342d,
            #141310
        );

    border-radius:
        40px 40px 12px 12px;

    border:
        2px solid #25221e;

    box-shadow:

        inset 0 4px 5px rgba(255,255,255,0.08),

        0 10px 20px rgba(0,0,0,0.8);
}


/* lamp rim */

.lamp-rim {

    position: absolute;

    top: 76px;

    left: 50%;

    transform: translateX(-50%);

    width: 92px;

    height: 22px;

    border-radius: 50%;

    background: #2d2923;

    border: 2px solid #181713;

    z-index: 4;
}


/* bulb */

.bulb {

    position: absolute;

    top: 80px;

    left: 50%;

    transform: translateX(-50%);

    width: 30px;

    height: 13px;

    border-radius: 50%;

    background: #ffe7ad;

    box-shadow:

        0 0 12px #ffe0a0,

        0 0 45px #d49a43,

        0 0 110px rgba(205,145,55,0.7),

        0 0 230px rgba(180,120,40,0.35);

    z-index: 5;
}


/* =========================================================
   LAMP LIGHT ON WALL
========================================================= */

.light-cone {

    position: absolute;

    top: 75px;

    left: 50%;

    transform: translateX(-50%);

    width: 900px;

    height: 700px;

    z-index: 3;

    pointer-events: none;

    background:

        radial-gradient(
            ellipse at 50% 0%,
            rgba(255,205,120,0.32) 0%,
            rgba(201,142,58,0.18) 25%,
            rgba(126,85,31,0.08) 45%,
            transparent 70%
        );

    clip-path: polygon(
        46% 0,
        54% 0,
        100% 100%,
        0 100%
    );

    filter: blur(7px);
}


/* =========================================================
   TITLE
========================================================= */

.title-area {

    position: relative;

    z-index: 8;

    height: 500px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    padding-bottom: 45px;
}


.logo {

    position: relative;

    font-family: "Permanent Marker", cursive;

    font-size: clamp(48px, 7vw, 100px);

    line-height: 0.9;

    color: #ddd4c3;

    transform: rotate(-3deg);

    letter-spacing: -3px;

    text-shadow:

        2px 3px 0 rgba(0,0,0,0.8),

        0 0 4px rgba(255,255,255,0.35);

    filter: drop-shadow(
        0 3px 3px rgba(0,0,0,0.8)
    );
}


/* spray mist */

.logo::before {

    content: "";

    position: absolute;

    inset: -25px -35px;

    background:

        radial-gradient(
            circle,
            rgba(220,210,195,0.18) 0 1px,
            transparent 2px
        );

    background-size:
        8px 9px;

    opacity: 0.6;

    z-index: -1;

    transform: rotate(4deg);
}


/* =========================================================
   ALE
========================================================= */

.ale {

    color: #c9342d;

    position: relative;

    display: inline-block;

    transform:
        rotate(3deg)
        scale(1.08);

    text-shadow:

        2px 3px 0 #631c19,

        0 0 5px rgba(201,52,45,0.35);
}


/* red paint drip */

.ale::after {

    content: "";

    position: absolute;

    left: 48%;

    top: 88%;

    width: 5px;

    height: 48px;

    background: #c9342d;

    border-radius:
        0 0 8px 8px;

    box-shadow:
        0 0 3px rgba(201,52,45,0.5);
}


/* small paint splatters */

.ale::before {

    content: "·  •   ·";

    position: absolute;

    top: 70%;

    left: -10px;

    color: #c9342d;

    font-family: Arial, sans-serif;

    font-size: 15px;

    letter-spacing: 8px;

    transform: rotate(-8deg);
}


/* =========================================================
   FILM SECTION
========================================================= */

.films {

    position: relative;

    z-index: 8;

    width: 100%;

    padding-bottom: 40px;
}


/* =========================================================
   FILM
========================================================= */

.film-wrapper {

    position: relative;

    width: 100%;

    margin-bottom: 100px;
}


.film {

    position: relative;

    width: 96%;

    margin-left: 2%;

    height: 190px;

    background:

        linear-gradient(
            180deg,
            #5b3219,
            #92552a 12%,
            #75401f 50%,
            #9a5a2e 88%,
            #5c3219
        );

    border-top:
        2px solid rgba(204,135,68,0.65);

    border-bottom:
        2px solid rgba(38,18,7,0.9);

    box-shadow:

        0 18px 35px rgba(0,0,0,0.85),

        inset 0 8px 10px rgba(255,190,100,0.08),

        inset 0 -8px 12px rgba(0,0,0,0.5);

    transform: rotate(-2deg);

    cursor: pointer;

    transition:
        transform 0.45s ease,
        filter 0.45s ease;
}


.film-wrapper:nth-child(even) .film {

    transform: rotate(1.5deg);
}


.film:hover {

    transform:
        rotate(0deg)
        scale(1.015);

    filter: brightness(1.12);
}


/* =========================================================
   FILM HOLES
========================================================= */

.holes {

    position: absolute;

    left: 0;

    right: 0;

    height: 17px;

    display: flex;

    justify-content: space-around;

    z-index: 10;
}


.holes.top {
    top: 7px;
}


.holes.bottom {
    bottom: 7px;
}


.hole {

    width: 25px;

    height: 13px;

    background: #050403;

    border-radius: 2px;

    box-shadow:
        inset 0 1px 2px rgba(255,255,255,0.06);
}


/* =========================================================
   FILM FRAMES
========================================================= */

.frames {

    position: absolute;

    left: 32px;

    right: 32px;

    top: 27px;

    bottom: 27px;

    display: flex;

    gap: 7px;
}


.frame {

    flex: 1;

    height: 100%;

    overflow: hidden;

    border-left:
        2px solid rgba(227,157,83,0.5);

    border-right:
        2px solid rgba(227,157,83,0.5);

    background: #24140b;
}


.frame img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    filter:

        grayscale(100%)

        sepia(0.55)

        contrast(1.3)

        brightness(0.75);

    opacity: 0.95;

    transition:
        transform 0.5s ease;
}


.film:hover img {

    transform: scale(1.06);
}


/* =========================================================
   KODAK TEXT
========================================================= */

.kodak {

    position: absolute;

    top: 2px;

    right: 50px;

    font-family: monospace;

    font-size: 8px;

    color: rgba(25,12,4,0.75);

    letter-spacing: 2px;
}


/* =========================================================
   COUNTRY NAME
========================================================= */

.country {

    position: relative;

    margin-top: 35px;

    margin-left: 8%;

    color: #eee9df;

    font-family: "Patrick Hand", cursive;

    font-size: 30px;

    letter-spacing: 1px;

    transform: rotate(-3deg);

    text-shadow:
        0 0 2px rgba(255,255,255,0.6);

    opacity: 0.92;
}


/* =========================================================
   SECOND COUNTRY SLIGHTLY DIFFERENT
========================================================= */

.film-wrapper:nth-child(even) .country {

    margin-left: 30%;

    transform: rotate(2deg);
}


/* =========================================================
   DOOR AREA
========================================================= */

.door-area {

    position: relative;

    z-index: 8;

    height: 700px;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    padding-bottom: 0;
}


/* door frame */

.door-frame {

    position: relative;

    width: 340px;

    height: 560px;

    background: #171614;

    border:
        8px solid #25221e;

    box-shadow:

        0 0 0 2px #050403,

        0 30px 70px rgba(0,0,0,0.95);
}


/* door */

.door {

    position: absolute;

    inset: 12px;

    background:

        linear-gradient(
            90deg,
            #0b0b0a,
            #20201e 50%,
            #090908
        );

    border:
        2px solid #35322e;

    cursor: pointer;

    transform-origin: left center;

    transition:
        transform 1.2s ease;

    overflow: hidden;
}


/* door panels */

.door::before {

    content: "";

    position: absolute;

    inset: 30px;

    border:
        2px solid #383631;

    box-shadow:

        inset 0 0 0 10px #11110f,

        inset 0 0 0 12px #292823;
}


/* door handle */

.handle {

    position: absolute;

    right: 25px;

    top: 50%;

    width: 13px;

    height: 13px;

    border-radius: 50%;

    background: #8c7659;

    z-index: 5;

    box-shadow:
        0 0 5px rgba(190,150,100,0.3);
}


/* enter */

.enter {

    position: absolute;

    left: 50%;

    top: 50%;

    transform: translate(-50%, -50%);

    color: #c6bfb3;

    font-family: "Patrick Hand", cursive;

    font-size: 18px;

    text-align: center;

    z-index: 5;

    white-space: nowrap;
}


.enter::after {

    content: "→";

    display: block;

    font-family: Arial;

    font-size: 30px;

    line-height: 20px;
}


/* door opening */

.door.open {

    transform:
        perspective(1000px)
        rotateY(-78deg);
}


/* =========================================================
   FOOTER
========================================================= */

.footer {

    position: relative;

    z-index: 8;

    text-align: center;

    padding: 35px;

    color: #57534c;

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 4px;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width: 700px) {

    .title-area {
        height: 400px;
    }

    .logo {
        font-size: 47px;
    }

    .film {
        width: 98%;
        margin-left: 1%;
        height: 150px;
    }

    .frames {
        left: 20px;
        right: 20px;
        top: 24px;
        bottom: 24px;
    }

    .hole {
        width: 15px;
        height: 10px;
    }

    .country {
        font-size: 25px;
        margin-left: 7%;
    }

    .film-wrapper:nth-child(even) .country {
        margin-left: 25%;
    }

    .door-frame {
        width: 290px;
        height: 500px;
    }

}

</style>
