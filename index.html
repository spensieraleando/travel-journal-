<style>

/* =====================================================
   RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: #050505;
    color: white;
    font-family: Arial, Helvetica, sans-serif;
    overflow-x: hidden;
}


/* =====================================================
   BLACK WALL
===================================================== */

.wall {

    position: relative;

    min-height: 100vh;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,255,255,0.025) 0 1px,
            transparent 2px
        ),
        radial-gradient(
            circle at 80% 70%,
            rgba(255,255,255,0.02) 0 1px,
            transparent 2px
        ),
        #050505;

    background-size: 17px 19px, 23px 25px;

    padding-bottom: 0;

    overflow: hidden;
}


/* subtle wall texture */

.wall::before {

    content: "";

    position: absolute;

    inset: 0;

    pointer-events: none;

    opacity: 0.25;

    background:

        linear-gradient(
            90deg,
            transparent 0%,
            rgba(255,255,255,0.025) 50%,
            transparent 100%
        );

}


/* =====================================================
   TOP AREA
===================================================== */

.header {

    height: 310px;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: center;

    overflow: hidden;
}


/* =====================================================
   PAINTED / GRAFFITI TITLE
===================================================== */

.logo {

    position: relative;

    font-family:
        "Arial Black",
        Impact,
        Haettenschweiler,
        sans-serif;

    font-size:
        clamp(65px, 12vw, 175px);

    font-weight: 900;

    letter-spacing: -9px;

    text-transform: lowercase;

    color: #e7dfd2;

    transform:
        rotate(-3deg)
        skewX(-5deg);

    /* painted wall effect */

    text-shadow:

        1px 2px 0 #c9c0b2,

        -2px -1px 0 rgba(0,0,0,0.5),

        4px 4px 0 rgba(0,0,0,0.25);
}


/* =====================================================
   ALE — STANDS OUT
===================================================== */

.logo .ale {

    position: relative;

    color: #c83b32;

    display: inline-block;

    transform:
        rotate(2deg)
        scale(1.04);

    text-shadow:

        1px 2px 0 #8e201b,

        -1px -1px 0 rgba(255,255,255,0.12),

        3px 3px 0 rgba(0,0,0,0.4);
}


/* painted underline */

.logo .ale::after {

    content: "";

    position: absolute;

    left: -5px;

    right: -7px;

    bottom: -3px;

    height: 7px;

    background: #c83b32;

    border-radius: 60% 30% 70% 20%;

    transform:
        rotate(-3deg)
        skewX(-15deg);
}


/* little paint splatter */

.logo::before {

    content: "•  ·   •";

    position: absolute;

    right: -55px;

    top: 15px;

    color: #c83b32;

    font-family: Arial;

    font-size: 22px;

    letter-spacing: 8px;

    transform: rotate(15deg);
}


/* =====================================================
   INTRO
===================================================== */

.intro {

    text-align: center;

    margin-bottom: 70px;

    color: #8c8780;

    font-family: Georgia, serif;

    font-style: italic;

    font-size: 16px;

}


/* =====================================================
   FILM STRIPS
===================================================== */

.film {

    width: 100%;

    height: 260px;

    position: relative;

    margin-bottom: 95px;

    cursor: pointer;

    overflow: hidden;

    background:

        linear-gradient(
            180deg,
            #633518 0%,
            #92562d 10%,
            #7c4524 50%,
            #98592f 90%,
            #5e321b 100%
        );

    box-shadow:

        0 20px 35px rgba(0,0,0,0.65),

        inset 0 8px 12px rgba(255,180,100,0.08),

        inset 0 -8px 12px rgba(0,0,0,0.35);

    transform:
        rotate(-1deg);

    transition:
        transform 0.5s ease,
        height 0.6s ease,
        box-shadow 0.5s ease;
}


.film:nth-child(even) {

    transform:
        rotate(1deg);
}


.film:hover {

    transform:
        rotate(0deg)
        scale(1.015);

    box-shadow:

        0 30px 50px rgba(0,0,0,0.8);
}


/* =====================================================
   KODAK MARKINGS
===================================================== */

.film-brand {

    position: absolute;

    right: 25px;

    top: 50%;

    transform:
        translateY(-50%)
        rotate(90deg);

    color: rgba(255,205,145,0.45);

    font-family: monospace;

    font-size: 9px;

    letter-spacing: 4px;

    white-space: nowrap;

    z-index: 5;
}


/* =====================================================
   PERFORATIONS
===================================================== */

.perforations {

    position: absolute;

    top: 8px;

    left: 0;

    right: 0;

    height: 18px;

    display: flex;

    justify-content: space-around;

    z-index: 10;
}


.perforations.bottom {

    top: auto;

    bottom: 8px;
}


.hole {

    width: 28px;

    height: 15px;

    background: #050505;

    border-radius: 2px;

    box-shadow:

        inset 0 1px 2px rgba(255,255,255,0.05);
}


/* =====================================================
   FRAMES
===================================================== */

.frames {

    height: 100%;

    width: 100%;

    padding:
        36px 55px;

    display: flex;

    align-items: center;

    gap: 9px;

    overflow: hidden;
}


.frame {

    height: 185px;

    flex: 1;

    min-width: 180px;

    position: relative;

    overflow: hidden;

    border:

        2px solid
        rgba(240,180,110,0.45);

    background: #402314;
}


/* =====================================================
   NEGATIVE IMAGE
===================================================== */

.frame img {

    width: 100%;

    height: 100%;

    object-fit: cover;

    filter:

        invert(1)

        sepia(0.75)

        saturate(1.25)

        contrast(1.3)

        brightness(0.9);

    opacity: 0.88;

    transition:

        filter 0.7s ease,

        transform 0.7s ease;
}


/* frame number */

.frame::after {

    content: "36";

    position: absolute;

    right: 6px;

    bottom: 4px;

    color: rgba(255,210,160,0.7);

    font-family: monospace;

    font-size: 10px;
}


/* =====================================================
   COUNTRY
===================================================== */

.country {

    position: absolute;

    left: 50%;

    top: 50%;

    transform:
        translate(-50%, -50%)
        rotate(-2deg);

    z-index: 30;

    font-family:
        "Arial Black",
        Impact,
        sans-serif;

    color: #f0c18b;

    font-size: 35px;

    letter-spacing: 7px;

    text-shadow:

        2px 2px 0 #35190c,

        0 0 20px rgba(0,0,0,0.8);

    pointer-events: none;
}


/* =====================================================
   FILM ACTIVE
===================================================== */

.film.active {

    position: fixed;

    z-index: 1000;

    left: 3vw;

    top: 8vh;

    width: 94vw;

    height: 84vh;

    margin: 0;

    transform: rotate(0deg);

    overflow-y: auto;

    box-shadow:

        0 30px 100px rgba(0,0,0,0.9);
}


.film.active .frames {

    height: auto;

    flex-wrap: wrap;

    justify-content: center;

    padding: 80px 50px;
}


.film.active .frame {

    flex: none;

    width: 300px;

    height: 220px;
}


/* =====================================================
   CLOSE
===================================================== */

.close {

    display: none;

    position: absolute;

    right: 30px;

    top: 25px;

    z-index: 100;

    color: #f0c18b;

    font-family: Arial;

    font-size: 11px;

    letter-spacing: 3px;

    cursor: pointer;
}


.film.active .close {

    display: block;
}


/* =====================================================
   DARK OVERLAY
===================================================== */

.overlay {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.85);

    z-index: 900;

    opacity: 0;

    pointer-events: none;

    transition: opacity 0.4s ease;
}


.overlay.active {

    opacity: 1;

    pointer-events: auto;
}


/* =====================================================
   DOOR
===================================================== */

.door-area {

    height: 750px;

    position: relative;

    display: flex;

    justify-content: center;

    align-items: flex-end;

    padding-bottom: 0;

    background:

        linear-gradient(
            90deg,
            #050505,
            #111 50%,
            #050505
        );
}


/* wall around door */

.door-frame {

    width: 430px;

    height: 690px;

    position: relative;

    background: #111;

    border:

        8px solid #24211e;

    box-shadow:

        0 0 0 2px #080808,

        0 25px 80px rgba(0,0,0,0.9);
}


/* actual door */

.door {

    position: absolute;

    inset: 12px;

    background:

        linear-gradient(
            90deg,
            #171412,
            #28221d 48%,
            #15120f
        );

    border:

        2px solid #3a332c;

    display: flex;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    cursor: pointer;

    transition:
        transform 1s ease;
}


/* door panels */

.door::before {

    content: "";

    position: absolute;

    inset: 35px;

    border:

        2px solid #3b342d;

    box-shadow:

        inset 0 0 0 12px #1b1815,

        inset 0 0 0 14px #332d27;
}


/* second panel */

.door::after {

    content: "";

    position: absolute;

    left: 55px;

    right: 55px;

    top: 50%;

    height: 2px;

    background: #3b342d;
}


/* door handle */

.handle {

    position: absolute;

    right: 40px;

    top: 50%;

    width: 12px;

    height: 12px;

    border-radius: 50%;

    background: #a27b4f;

    box-shadow:

        0 0 10px rgba(190,140,80,0.3);

    z-index: 10;
}


/* door text */

.enter {

    position: absolute;

    bottom: 75px;

    z-index: 10;

    color: #c8bbaa;

    font-family: Arial;

    font-size: 10px;

    letter-spacing: 5px;

    opacity: 0.7;
}


/* =====================================================
   DOOR OPEN ANIMATION
===================================================== */

.door.open {

    transform:
        perspective(1200px)
        rotateY(-75deg);

    transform-origin: left center;
}


/* light behind door */

.door-light {

    position: absolute;

    inset: 0;

    background:

        radial-gradient(
            ellipse,
            #f0e3ce,
            #9d8970 45%,
            #29231d 80%
        );

    opacity: 0;

    transition: opacity 1s ease;
}


.door.open .door-light {

    opacity: 1;
}


/* =====================================================
   BOTTOM TEXT
===================================================== */

.bottom {

    text-align: center;

    padding: 70px 20px 30px;

    color: #777;

    font-family: Arial;

    font-size: 9px;

    letter-spacing: 4px;
}


/* =====================================================
   MOBILE
===================================================== */

@media(max-width: 700px) {

        top: 5vh;

        width: 96vw;

        height: 90vh;
    }


    .film.active .frame {

        width: 100%;

        height: 210px;
    }


    .door-area {

        height: 600px;
    }


    .door-frame {

        width: 300px;

        height: 540px;
    }

}

</style>

<script>

/* ==========================================
   OPEN FILM
========================================== */

function openFilm(film) {

    event.stopPropagation();

    film.classList.add("active");

    document
        .getElementById("overlay")
        .classList.add("active");
}


/* ==========================================
   CLOSE FILM
========================================== */

function closeFilm(event) {

    event.stopPropagation();

    const film =
        event.target.closest(".film");

    film.classList.remove("active");

    document
        .getElementById("overlay")
        .classList.remove("active");
}


/* ==========================================
   CLICK OUTSIDE FILM
========================================== */

document
    .getElementById("overlay")
    .addEventListener(
        "click",
        function() {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                this.classList.remove(
                    "active"
                );
            }

        }
    );


/* ==========================================
   ESCAPE KEY
========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Escape") {

            const active =
                document.querySelector(
                    ".film.active"
                );

            if (active) {

                active.classList.remove(
                    "active"
                );

                document
                    .getElementById("overlay")
                    .classList.remove(
                        "active"
                    );
            }
        }
    }
);


/* ==========================================
   DOOR
========================================== */

function openDoor() {

    const door =
        document.getElementById("door");

    door.classList.toggle("open");

}

</script>
